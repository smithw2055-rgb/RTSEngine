name: Diagnose next slice

on:
  push:
    branches:
      - agent/foundation-architecture
    paths:
      - .github/workflows/diagnose-next-slice.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-architecture
          fetch-depth: 0
      - name: Capture configure, build, and test output
        shell: bash
        run: |
          set +e
          cmake -S . -B build-diagnose -DCMAKE_BUILD_TYPE=Debug -DRTSENGINE_BUILD_TESTS=ON -DRTSENGINE_BUILD_EXAMPLES=ON > configure.log 2>&1
          configure_status=$?
          build_status=99
          test_status=99
          if [ "$configure_status" -eq 0 ]; then
            cmake --build build-diagnose --parallel 2 > build.log 2>&1
            build_status=$?
          else
            : > build.log
          fi
          if [ "$build_status" -eq 0 ]; then
            ctest --test-dir build-diagnose --output-on-failure > test.log 2>&1
            test_status=$?
          else
            : > test.log
          fi
          mkdir -p diagnostics
          {
            echo "configure_status=$configure_status build_status=$build_status test_status=$test_status"
            echo '--- configure ---'
            tail -n 100 configure.log
            echo '--- build ---'
            tail -n 320 build.log
            echo '--- test ---'
            tail -n 200 test.log
          } > diagnostics/next-slice.log
      - name: Publish diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/next-slice.log
          git commit -m "chore(ci): publish next-slice diagnostics" || exit 0
          git push origin HEAD:agent/foundation-architecture
