name: Materialize Engine G3

on:
  push:
    branches:
      - agent/engine-g3-combat-squad-ai

permissions:
  contents: write

concurrency:
  group: materialize-engine-g3
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify build test and publish implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_failure() {
            status=$?
            trap - ERR
            mkdir -p .g3
            {
              echo "Engine G3 materialization failed with status ${status}."
              for log in /tmp/g3-prep.log /tmp/g3-config.log /tmp/g3-build.log /tmp/g3-test.log; do
                if [[ -f "${log}" ]]; then
                  echo
                  echo "===== ${log} ====="
                  tail -n 500 "${log}"
                fi
              done
            } > .g3/failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .g3/failure.log
            git commit -m "Record Engine G3 gate failure" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" || true
            exit "${status}"
          }
          trap publish_failure ERR

          if [[ ! -d .g3 ]]; then
            echo "Implementation is already materialized."
            exit 0
          fi
          {
            cat .g3/part-* > /tmp/engine-g3.b64
            sha256sum /tmp/engine-g3.b64
            echo "bf5478349c438b33bd5dee67c0d5d69020e6b75f0ed990ad2f5ff5b80f5345d6  /tmp/engine-g3.b64" | sha256sum -c -
            base64 --decode /tmp/engine-g3.b64 > /tmp/engine-g3.tar.gz
            sha256sum /tmp/engine-g3.tar.gz
            echo "b682ee9904101e2394d3d3f9e6de91360d7856ae789c1205ff1f311976780e58  /tmp/engine-g3.tar.gz" | sha256sum -c -
            tar -tzf /tmp/engine-g3.tar.gz
            tar -xzf /tmp/engine-g3.tar.gz -C .
            python - <<'PY'
          from pathlib import Path

          patch = Path('.g3/patch.py')
          patch_text = patch.read_text()
          patch_text = patch_text.split('# Focused regression target.', 1)[0]
          patch.write_text(patch_text)

          cmake = Path('tests/CMakeLists.txt')
          cmake_text = cmake.read_text()
          if 'add_executable(rts_engine_g3_tests ' not in cmake_text:
              marker = 'add_executable(rts_lane_graph_tests lane_graph_tests.cpp)\n'
              block = (
                  'add_executable(rts_engine_g3_tests engine_g3_tests.cpp)\n'
                  'target_link_libraries(rts_engine_g3_tests PRIVATE RTSEngine::Rts)\n'
                  'add_test(NAME rts_engine_g3_tests COMMAND rts_engine_g3_tests)\n\n'
              )
              if marker not in cmake_text:
                  raise SystemExit('G3 test CMake marker not found')
              cmake.write_text(cmake_text.replace(marker, block + marker, 1))

          test = Path('tests/engine_g3_tests.cpp')
          test_text = test.read_text()
          old = 'void require(bool value) {\n    if (!value) std::abort();\n}\n'
          new = '''void requireImpl(bool value, const char* expression, int line) {
              if (!value) {
                  std::cerr << "G3 require failed at line " << line
                            << ": " << expression << '\\n';
                  std::abort();
              }
          }
          #define require(value) requireImpl((value), #value, __LINE__)
          '''
          if old not in test_text:
              raise SystemExit('G3 require helper not found')
          test_text = test_text.replace(old, new, 1)
          caster = '    const auto caster = game.base().createUnit({1, 1}, {1}, 1, soldierCombat());\n'
          passive = (
              '    auto casterCombat = soldierCombat();\n'
              '    casterCombat.weaponDamage = 0;\n'
              '    const auto caster = game.base().createUnit({1, 1}, {1}, 1, casterCombat);\n'
          )
          if caster not in test_text:
              raise SystemExit('G3 ability caster line not found')
          test_text = test_text.replace(caster, passive, 1)
          blocking_enemy = (
              '    const auto enemy = game.base().createUnit({2, 1}, {0}, 2, soldierCombat());\n'
          )
          if blocking_enemy not in test_text:
              raise SystemExit('G3 stun blocking enemy line not found')
          test_text = test_text.replace(blocking_enemy, '', 1)
          test_text = test_text.replace('    (void)enemy;\n', '', 1)
          test.write_text(test_text)

          header = Path('framework/rts/include/RTSEngine/Rts/G3GameSession.h')
          header_text = header.read_text()
          needle = '!ally && !base_.simulation().vision().visible('
          occurrences = header_text.count(needle)
          if occurrences != 2:
              raise SystemExit(
                  f'expected 2 G3 visibility checks, found {occurrences}')
          replacement = (
              '!ally && base_.simulation().nextExpectedTick() != 0 &&\n'
              '                    !base_.simulation().vision().visible('
          )
          header.write_text(header_text.replace(needle, replacement))
          PY
            python .g3/patch.py
            git diff --check
          } > /tmp/g3-prep.log 2>&1

          cmake -S . -B build-g3 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRTSENGINE_BUILD_TESTS=ON \
            -DRTSENGINE_BUILD_EXAMPLES=OFF \
            -DRTSENGINE_ENABLE_REALSCRIPT=OFF \
            > /tmp/g3-config.log 2>&1
          cmake --build build-g3 --parallel 2 \
            --target rts_engine_g3_tests \
                     rts_combat_tests \
                     rts_combat_integration_tests \
                     rts_simulation_persistence_tests \
            > /tmp/g3-build.log 2>&1
          ctest --test-dir build-g3 --output-on-failure \
            -R '^rts_(engine_g3|combat|combat_integration|simulation_persistence)_tests$' \
            > /tmp/g3-test.log 2>&1

          trap - ERR
          rm -rf .g3 .github/workflows/materialize-engine-g3.yml build-g3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Engine G3 combat and squad AI"
          git push origin HEAD:"${GITHUB_REF_NAME}"
