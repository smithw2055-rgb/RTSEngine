name: Cleanup failed Actions history

on:
  push:
    branches:
      - agent/foundation-architecture
    paths:
      - .github/workflows/cleanup-failed-runs.yml

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-architecture
          fetch-depth: 0

      - name: Wait for earlier branch runs to finish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="$GITHUB_REF_NAME"
          current="$GITHUB_RUN_ID"

          for _ in $(seq 1 60); do
            active="$({
              gh api --method GET "repos/$repo/actions/runs" \
                -f branch="$branch" \
                -f per_page=100 \
                --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id'
            } | grep -v "^${current}$" | wc -l | tr -d ' ')"
            if [[ "$active" == "0" ]]; then
              exit 0
            fi
            sleep 5
          done

      - name: Delete failed and cancelled runs
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="$GITHUB_REF_NAME"
          current="$GITHUB_RUN_ID"
          deleted=0

          mapfile -t run_ids < <(
            gh api --method GET --paginate \
              "repos/$repo/actions/runs" \
              -f branch="$branch" \
              -f status=completed \
              -f per_page=100 \
              --jq '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id'
          )

          for run_id in "${run_ids[@]}"; do
            if [[ -n "$run_id" && "$run_id" != "$current" ]]; then
              echo "Deleting workflow run $run_id"
              gh api --method DELETE "repos/$repo/actions/runs/$run_id"
              deleted=$((deleted + 1))
            fi
          done

          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-failed-runs.yml
          git commit -m "chore(ci): remove cleanup after deleting ${{ steps.cleanup.outputs.deleted }} failed runs"
          git push origin HEAD:agent/foundation-architecture
