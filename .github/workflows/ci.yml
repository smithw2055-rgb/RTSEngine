name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRTSENGINE_BUILD_TESTS=ON -DRTSENGINE_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  diagnostic-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture configure, build, and test output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          cmake -S . -B build-diagnose -DCMAKE_BUILD_TYPE=Debug -DRTSENGINE_BUILD_TESTS=ON -DRTSENGINE_BUILD_EXAMPLES=ON > diagnostics/configure.log 2>&1
          configure_status=$?
          build_status=99
          test_status=99
          if [ "$configure_status" -eq 0 ]; then
            cmake --build build-diagnose --parallel 2 > diagnostics/build.log 2>&1
            build_status=$?
          else
            : > diagnostics/build.log
          fi
          if [ "$build_status" -eq 0 ]; then
            ctest --test-dir build-diagnose --output-on-failure > diagnostics/test.log 2>&1
            test_status=$?
          else
            : > diagnostics/test.log
          fi
          printf 'configure_status=%s\nbuild_status=%s\ntest_status=%s\n' "$configure_status" "$build_status" "$test_status" > diagnostics/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: next-slice-diagnostics
          path: diagnostics
          if-no-files-found: error
