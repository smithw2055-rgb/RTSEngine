name: RS2 Scripting

on:
  pull_request:
    paths:
      - "framework/rts_scripting/**"
      - "engine/scripting/**"
      - "tests/rts_script_adapter_tests.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/rs2-scripting.yml"
  push:
    branches:
      - main
    paths:
      - "framework/rts_scripting/**"
      - "engine/scripting/**"
      - "tests/rts_script_adapter_tests.cpp"
      - "CMakeLists.txt"

permissions:
  contents: read

jobs:
  adapter:
    name: RTS script adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned RealScript SDK
        uses: actions/checkout@v4
        with:
          repository: smithw2055-rgb/RealScript
          ref: 50d13a0074d9555391f63e0dd0b1a3c2b07b040e
          path: .ci/RealScript
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-rs2 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRTSENGINE_BUILD_TESTS=ON \
            -DRTSENGINE_BUILD_EXAMPLES=OFF \
            -DRTSENGINE_ENABLE_REALSCRIPT=ON \
            -DRTSENGINE_REALSCRIPT_SOURCE_DIR="$GITHUB_WORKSPACE/.ci/RealScript"
      - name: Build
        shell: bash
        run: |
          cmake --build build-rs2 --config Debug \
            --target rts_script_adapter_tests --parallel 2
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build-rs2 -C Debug --output-on-failure \
            -R "^rts_script_adapter_tests$"
