name: G3 Roguelite Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add assertion diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/roguelite_persistence_tests.cpp')
          text = path.read_text()
          old = '''void check(bool condition) {
              assert(condition);
              if (!condition) std::abort();
          }
          '''
          new = '''void checkImpl(bool condition, const char* expression, int line) {
              if (!condition) {
                  std::cerr << "roguelite persistence check failed at line "
                            << line << ": " << expression << '\\n';
                  std::abort();
              }
          }
          #define check(condition) checkImpl((condition), #condition, __LINE__)
          '''
          if old not in text:
              raise SystemExit('check helper not found')
          text = text.replace(old, new, 1)
          marker = '    check(completed);\n'
          diagnostics = '''    if (!completed) {
              const auto& runState = original.state();
              const auto& towerSnapshot = original.tower().snapshot();
              const auto& world = original.tower().rts().world();
              std::cerr << "run did not complete: phase="
                        << static_cast<int>(runState.phase)
                        << " completedWaves=" << runState.completedWaves
                        << " wavePhase="
                        << static_cast<int>(towerSnapshot.wave.phase)
                        << " spawned=" << towerSnapshot.wave.spawned
                        << " resolved=" << towerSnapshot.wave.resolved
                        << " enemies=" << towerSnapshot.enemies.size() << '\\n';
              for (const auto& enemySnapshot : towerSnapshot.enemies) {
                  const auto* position = world.try_get<gameplay::Position>(enemySnapshot.entity);
                  const auto* health = world.try_get<gameplay::Health>(enemySnapshot.entity);
                  std::cerr << " enemy=" << enemySnapshot.entity.index
                            << ":" << enemySnapshot.entity.generation
                            << " alive=" << enemySnapshot.alive
                            << " waypoint=" << enemySnapshot.waypointIndex
                            << "/" << enemySnapshot.waypointCount
                            << " position=" << (position ? position->x : -999)
                            << "," << (position ? position->y : -999)
                            << " health=" << (health ? health->current : -999)
                            << '\\n';
              }
              world.eachRef<gameplay::Position, gameplay::Team, gameplay::Health>(
                  [&](ecs::Entity entity,
                      const gameplay::Position& position,
                      const gameplay::Team& team,
                      const gameplay::Health& health) {
                      const auto* weapon = world.try_get<gameplay::Weapon>(entity);
                      const auto* target = world.try_get<gameplay::CombatTarget>(entity);
                      const auto* directive = world.try_get<gameplay::CombatDirective>(entity);
                      std::cerr << " actor=" << entity.index << ":" << entity.generation
                                << " team=" << team.id
                                << " position=" << position.x << "," << position.y
                                << " health=" << health.current << "/" << health.maximum
                                << " weaponDamage=" << (weapon ? weapon->damage : -999)
                                << " weaponRange=" << (weapon ? weapon->range : -999)
                                << " cooldown=" << (weapon ? weapon->cooldownRemaining : 999999)
                                << " projectile=" << (weapon ? weapon->projectileDefinitionId : 999999)
                                << " target=" << (target ? target->entity.index : 0)
                                << ":" << (target ? target->entity.generation : 0)
                                << " mode=" << (directive ? static_cast<int>(directive->mode) : -1)
                                << '\\n';
                  });
          }
          check(completed);
          '''
          if marker not in text:
              raise SystemExit('completed assertion not found')
          path.write_text(text.replace(marker, diagnostics, 1))
          PY
      - name: Configure
        run: cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=Debug -DRTSENGINE_BUILD_TESTS=ON -DRTSENGINE_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build-diag --parallel 2 --target rts_roguelite_persistence_tests
      - name: Test
        run: ctest --test-dir build-diag --output-on-failure -R '^rts_roguelite_persistence_tests$'
