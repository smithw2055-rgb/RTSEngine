name: Finalize Engine G3 compatibility

on:
  push:
    branches:
      - agent/engine-g3-combat-squad-ai

permissions:
  contents: write

concurrency:
  group: finalize-engine-g3-compatibility
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore legacy movement contract and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          report_failure() {
            status=$?
            trap - ERR
            mkdir -p .g3fix
            {
              echo "Engine G3 compatibility gate failed with status ${status}."
              for log in /tmp/g3fix-patch.log /tmp/g3fix-config.log /tmp/g3fix-build.log /tmp/g3fix-test.log; do
                if [[ -f "${log}" ]]; then
                  echo
                  echo "===== ${log} ====="
                  tail -n 500 "${log}"
                fi
              done
            } > .g3fix/failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .g3fix/failure.log
            git commit -m "Record Engine G3 compatibility failure" || true
            git push origin HEAD:"${GITHUB_REF_NAME}" || true
            exit "${status}"
          }
          trap report_failure ERR

          python - <<'PY' > /tmp/g3fix-patch.log 2>&1
          from pathlib import Path
          import re

          path = Path('framework/rts/include/RTSEngine/Rts/MovementSystem.h')
          text = path.read_text()
          pattern = re.compile(
              r'(?P<indent>[ ]*)const auto effectiveSteps = control && control->stunned\n'
              r'(?P=indent)    \? 0\n'
              r'(?P=indent)    : static_cast<std::int32_t>\(\n'
              r'(?P=indent)          static_cast<std::int64_t>\(speed\.cellsPerTick\) \*\n'
              r'(?P=indent)          \(control \? control->moveScalePermille : 1000u\) / 1000u\);'
          )

          def replacement(match):
              indent = match.group('indent')
              return (
                  f'{indent}const auto scaledSteps = static_cast<std::int32_t>(\n'
                  f'{indent}    static_cast<std::int64_t>(speed.cellsPerTick) *\n'
                  f'{indent}    (control ? control->moveScalePermille : 1000u) / 1000u);\n'
                  f'{indent}const auto effectiveSteps = control && control->stunned\n'
                  f'{indent}    ? 0\n'
                  f'{indent}    : std::max<std::int32_t>(1, scaledSteps);'
              )

          updated, count = pattern.subn(replacement, text)
          if count != 2:
              raise SystemExit(f'expected two movement scale sites, found {count}')
          path.write_text(updated)
          PY

          git diff --check
          cmake -S . -B build-g3fix \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRTSENGINE_BUILD_TESTS=ON \
            -DRTSENGINE_BUILD_EXAMPLES=OFF \
            -DRTSENGINE_ENABLE_REALSCRIPT=OFF \
            > /tmp/g3fix-config.log 2>&1
          cmake --build build-g3fix --parallel 2 \
            --target rts_engine_g3_tests \
                     rts_combat_tests \
                     rts_combat_integration_tests \
                     rts_simulation_persistence_tests \
                     rts_roguelite_persistence_tests \
            > /tmp/g3fix-build.log 2>&1
          ctest --test-dir build-g3fix --output-on-failure \
            -R '^rts_(engine_g3|combat|combat_integration|simulation_persistence|roguelite_persistence)_tests$' \
            > /tmp/g3fix-test.log 2>&1

          trap - ERR
          rm -rf .g3fix build-g3fix .github/workflows/g3-roguelite-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore legacy zero-speed movement compatibility"
          git push origin HEAD:"${GITHUB_REF_NAME}"
