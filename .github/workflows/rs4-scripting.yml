name: RS4 Scripting

on:
  pull_request:
  push:
    branches:
      - agent/rs4-entity-behaviors-triggers

permissions:
  contents: read

concurrency:
  group: rs4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  entity-behaviors:
    name: entity behaviors (${{ matrix.os }}, Debug)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned RealScript SDK
        uses: actions/checkout@v4
        with:
          repository: smithw2055-rgb/RealScript
          ref: e07b519acd3935def0f6d1079e3d366472fa30b5
          path: .ci/RealScript
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-rs4 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRTSENGINE_BUILD_TESTS=ON \
            -DRTSENGINE_BUILD_EXAMPLES=OFF \
            -DRTSENGINE_ENABLE_REALSCRIPT=ON \
            -DRTSENGINE_REALSCRIPT_SOURCE_DIR="$GITHUB_WORKSPACE/.ci/RealScript"
      - name: Build
        shell: bash
        run: |
          cmake --build build-rs4 --config Debug --parallel 2 \
            --target rts_scripting_tests \
                     rts_rts_scripting_tests \
                     rts_script_state_lockstep_tests \
                     rts_entity_behavior_tests \
            > rs4-build.log 2>&1 || {
              tail -n 320 rs4-build.log
              exit 1
            }
      - name: Test
        shell: bash
        run: |
          ctest --test-dir build-rs4 -C Debug --output-on-failure \
            -R "^rts_(scripting|rts_scripting|script_state_lockstep|entity_behavior)_tests$" \
            > rs4-tests.log 2>&1 || {
              cat rs4-tests.log
              exit 1
            }
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rs4-logs-${{ matrix.os }}
          path: |
            rs4-build.log
            rs4-tests.log
          if-no-files-found: ignore
          retention-days: 3
