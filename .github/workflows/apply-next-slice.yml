name: Apply next slice refactor

on:
  push:
    branches:
      - agent/foundation-architecture
    paths:
      - .refactor/apply_next_slice.py
      - .github/workflows/apply-next-slice.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/foundation-architecture
          fetch-depth: 0

      - name: Apply refactor
        run: python3 .refactor/apply_next_slice.py

      - name: Remove migration scaffolding
        run: |
          rm -rf .refactor
          rm -f .github/workflows/apply-next-slice.yml

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRTSENGINE_BUILD_TESTS=ON -DRTSENGINE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit materialized refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(rts): extract contracts and apply gameplay modifiers"
          git push origin HEAD:agent/foundation-architecture
