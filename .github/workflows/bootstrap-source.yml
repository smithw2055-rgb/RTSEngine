name: Bootstrap source tree

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  unpack:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.issue.number == 1 &&
       github.event.comment.body == '/expand-source')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: agent/redesign-deterministic-rts-core
          fetch-depth: 0

      - name: Verify and materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/source.part* | base64 --decode > /tmp/rtsengine-source.tar.xz
          echo "f8ff007b597411dee9d5ca32818737c03ffc8960e0ac0cefdacbadec2f1979f3  /tmp/rtsengine-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/rtsengine-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/bootstrap-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign deterministic RTS engine core"
          git push origin HEAD:agent/redesign-deterministic-rts-core
